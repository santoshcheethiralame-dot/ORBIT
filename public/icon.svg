  <circle cx="256" cy="256" r="152" fill="none" stroke="#FF5A1F" stroke-width="12" opacity="0.22"/>
  <circle cx="256" cy="256" r="112" fill="none" stroke="#FF5A1F" stroke-width="12" opacity="0.4"/>
  <!-- yellow planet on the orbit -->
  <circle cx="256" cy="104" r="22" fill="#FFD60A"/>
  <!-- core "O" -->
  <circle cx="256" cy="256" r="66" fill="#FF5A1F"/>
  <circle cx="256" cy="256" r="27" fill="#0A0A0A"/>
</svg>
